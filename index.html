<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="HUMAN vs AI — Overlord Arena. Neo-Delhi 2099. A free 3v1 browser fighting game: knock out Grok, ChatGPT and Claude, charge your Chai meter and unleash the Gujarati Chai Brahmastra.">
<title>HUMAN vs AI — Overlord Arena | Neo-Delhi 2099</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta property="og:type" content="website">
<meta property="og:title" content="HUMAN vs AI — Overlord Arena | Neo-Delhi 2099">
<meta property="og:description" content="3v1 browser fighting game. Knock out all three AI overlords before the timer runs out — and hit them with the Chai Brahmastra.">
<meta property="og:image" content="assets/og/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://pratikdevlabs.github.io/human-vs-ai-parody/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="HUMAN vs AI — Overlord Arena | Neo-Delhi 2099">
<meta name="twitter:description" content="3v1 browser fighting game. Chai Brahmastra included.">
<meta name="twitter:image" content="assets/og/og-image.png">
<link rel="stylesheet" href="assets/css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./assets/vendor/three/three.module.js",
    "three/addons/": "./assets/vendor/three/addons/"
  }
}
</script>
</head>
<body data-screen="loading">
<canvas id="gameCanvas"></canvas>
<div id="vignetteFx"></div>
<div id="dimFx"></div>
<div id="letterbox"><div class="lb bar top"></div><div class="lb bar bot"></div></div>

<!-- ===================== HUD ===================== -->
<div id="hud" class="hidden">
  <div id="topbar">
    <div id="scoreWrap"><span id="scoreNum">0</span></div>
    <div id="timer">3:00</div>
    <div id="comboWrap" class="hidden"><span id="comboNum">0</span><span class="comboLbl" data-k="combo">COMBO</span></div>
    <div class="topBtns">
      <button id="btnSound" class="tbtn" aria-label="sound"></button>
      <button id="btnFull" class="tbtn" aria-label="fullscreen"></button>
      <button id="btnPause" class="tbtn" aria-label="pause"></button>
    </div>
  </div>
  <div id="cards"></div>
  <div id="playerPanel">
    <div class="phpRow">
      <div id="pHpBar"><div id="pHpTrail"></div><div id="pHpFill"></div></div>
      <div id="pHpNum">220</div>
    </div>
    <div id="pStamBar"><div id="pStamFill"></div></div>
    <div id="chaiRow">
      <div id="chaiRing"><div id="chaiCore"></div></div>
      <div id="chaiBar"><div id="chaiFill"></div></div>
    </div>
  </div>
  <button id="btnUlt" class="abtn ultBtn" data-act="ult" aria-label="chai ult"></button>
  <div id="banner" class="hidden"></div>
  <div id="feed"></div>
  <div id="floaters"></div>
  <div id="telegraphs"></div>
  <div id="edgeArrows"></div>
  <div id="hitDir" class="hidden"><svg viewBox="0 0 24 24" class="ic"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div id="subtitles" class="hidden"><span id="subSpeaker"></span><span id="subText"></span></div>
  <div id="countBig" class="hidden"></div>
  <div id="lowHpFx"></div>
</div>

<!-- touch controls layer (buttons injected by Controls) -->
<div id="touchLayer" class="hidden"></div>

<!-- ===================== SCREENS ===================== -->
<section id="screen-loading" class="screen active">
  <div class="loadInner">
    <div class="loadEmblem" id="loadEmblem"></div>
    <h1 id="loadTitle">HUMAN vs AI</h1>
    <div id="loadTag">OVERLORD ARENA — NEO-DELHI 2099</div>
    <div class="loadBarWrap"><div id="loadBar"></div></div>
    <div id="loadPct">0%</div>
  </div>
</section>

<section id="screen-menu" class="screen">
  <div class="menuInner">
    <div class="titleWrap">
      <h1 id="menuTitle">HUMAN vs AI</h1>
      <div id="menuTag">OVERLORD ARENA — NEO-DELHI 2099</div>
    </div>
    <div class="secLbl" id="fightLbl">FIGHTERS</div>
    <div id="fighterCards"></div>
    <div class="diffWrap">
      <div class="secLbl" id="diffLbl">DIFFICULTY</div>
      <div id="diffSeg" class="seg"></div>
      <div id="diffReadout"></div>
    </div>
    <button id="btnPlay" class="cta"></button>
    <div class="menuRow">
      <button id="btnSettings" class="mbtn"></button>
      <button id="btnHelp" class="mbtn"></button>
      <button id="btnInstall" class="mbtn hidden"></button>
    </div>
    <div id="statsRow"></div>
    <div id="credit"></div>
  </div>
  <div id="rotateHint">Rotate your phone for the best experience — portrait also works!</div>
</section>

<section id="screen-vs" class="screen">
  <div class="vsInner">
    <div class="vsYou">
      <div class="vsEmb you" id="vsYouEmblem"></div>
      <div class="vsNameBig" id="vsYouName">YOU</div>
      <div class="vsTitleBig">THE HUMAN</div>
    </div>
    <div class="vsVs">VS</div>
    <div id="vsEnemyWrap"></div>
    <button id="vsSkip" class="mbtn">SKIP</button>
  </div>
</section>

<section id="screen-result" class="screen">
  <div class="resInner">
    <div id="resVerdict">VICTORY</div>
    <div id="resGrade">S</div>
    <div id="resNewBest" class="hidden">NEW BEST SCORE!</div>
    <div id="resStats"></div>
    <div id="resBest"></div>
    <div class="resBtns">
      <button id="btnRetry" class="cta"></button>
      <button id="btnChangeDiff" class="mbtn"></button>
      <button id="btnShare" class="mbtn"></button>
      <button id="btnResMenu" class="mbtn"></button>
    </div>
    <div class="ctaBlock">
      <h3 id="ctaHeading">AI se badla pura nahi hua?</h3>
      <p id="ctaBody"></p>
      <a id="ctaBtn" class="cta ig" href="https://www.instagram.com/pratik_roy_820?rpxt=MTIyNncxaDZ4bXhhbg==" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </div>
</section>

<section id="screen-pause" class="screen overlay">
  <div class="pauseInner">
    <h2 id="pauseTitle">PAUSED</h2>
    <div id="pauseHint"></div>
    <button id="btnResume" class="cta"></button>
    <button id="btnRestart" class="mbtn"></button>
    <button id="btnPauseSettings" class="mbtn"></button>
    <button id="btnQuit" class="mbtn"></button>
  </div>
</section>

<div id="modal-settings" class="modal">
  <div class="modalCard">
    <h3>SETTINGS</h3>
    <div id="setBody"></div>
  </div>
</div>

<!-- tutorial overlay -->
<div id="tutorial" class="hidden">
  <div id="tutBox" class="hidden"></div>
  <div class="tutBar">
    <div id="tutText"></div>
    <div class="tutBtns">
      <button id="tutSkip" class="mbtn"></button>
      <button id="tutNext" class="mbtn"></button>
    </div>
  </div>
</div>

<div id="debug" class="hidden"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
